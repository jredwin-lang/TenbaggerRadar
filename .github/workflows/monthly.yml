name: Monthly company review
on:
  schedule:
    - cron: '0 7 1 * *'
      timezone: Asia/Seoul
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar-refresh
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node monthly-review.cjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add monthly-review.json monthly-history
          git diff --staged --quiet || git commit -m "Record monthly official financial review"
          git push
