name: Refresh Radar
on:
  push:
    paths: [template.html, refresh.cjs, market-app.js, market.css, collect.cjs, compact.cjs, watch-config.json, monthly-review.cjs, company-notes.json, enrich.cjs, archive-rankings.cjs, .github/workflows/refresh.yml]
  schedule:
    - cron: '50 6,21 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node refresh.cjs
      - name: Collect verified macro, heatmap, US and Korean market records
        run: node collect.cjs
      - name: Collect company descriptions and recent article metadata
        run: node enrich.cjs
      - name: Archive dated rankings
        run: node archive-rankings.cjs
      - name: Preserve history and refreshed inputs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html inputs.json market.json history signature.json ranking-history
          git diff --staged --quiet || git commit -m "Refresh verified market data and archive opinion changes"
          git push
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir _site
          cp index.html .nojekyll market.json market-app.js market.css company-notes.json _site/
          cp -r ranking-history _site/
          if [ -f monthly-review.json ]; then cp monthly-review.json _site/; fi
          if [ -d monthly-history ]; then cp -r monthly-history _site/; fi
          cp -r history _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
